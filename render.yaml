services:
  - type: web
    name: cet-portal-api
    runtime: node
    rootDir: cet-api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_INACTIVITY_TIMEOUT_MINUTES
        value: 30
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NOTES_QUESTION_MODEL
        value: gpt-4o-mini
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: PYTHON_EMAIL_SERVICE_URL
        value: https://cet-exam-portal-2.onrender.com
      - key: PYTHON_EMAIL_SERVICE_TOKEN
        sync: false
      - key: EMAIL_SENDER_EMAIL
        sync: false
      - key: EMAIL_SENDER_NAME
        value: CETNova
      - key: EMAIL_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: PUBLIC_API_URL
        sync: false

  - type: worker
    name: cet-portal-scheduler
    runtime: node
    rootDir: cet-api
    buildCommand: npm install
    startCommand: npm run scheduler
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PYTHON_EMAIL_SERVICE_URL
        value: https://cet-exam-portal-2.onrender.com
      - key: PYTHON_EMAIL_SERVICE_TOKEN
        sync: false
      - key: EMAIL_SENDER_EMAIL
        sync: false
      - key: EMAIL_SENDER_NAME
        value: CETNova
      - key: EMAIL_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
  - type: web
    name: cet-portal-python-mailer
    runtime: python
    rootDir: cet-api/python-email-service
    buildCommand: python -m compileall -q .
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: EMAIL_SERVICE_HOST
        value: 0.0.0.0
      - key: PYTHON_EMAIL_SERVICE_TOKEN
        sync: false
      - key: EMAIL_SMTP_HOST
        value: smtp.gmail.com
      - key: EMAIL_SMTP_PORT
        value: 587
      - key: EMAIL_SMTP_USERNAME
        sync: false
      - key: EMAIL_SMTP_PASSWORD
        sync: false
      - key: EMAIL_SMTP_FROM
        sync: false
      - key: EMAIL_SENDER_NAME
        value: CETNova
