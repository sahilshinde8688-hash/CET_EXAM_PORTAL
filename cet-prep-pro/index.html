<!doctype html>
<html lang="en" class="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpeg" />
    <link rel="shortcut icon" type="image/jpeg" href="/favicon.jpeg" />
    <link rel="apple-touch-icon" href="/favicon.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#d21436" />
    <script>
      try {
        const theme = localStorage.getItem('cetNovaTheme') === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.classList.toggle('light', theme === 'light')
        document.documentElement.style.colorScheme = theme
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').content = '#0B1120'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <meta name="description" content="Prepare for MHT-CET with focused mock tests, timed practice, personal results and performance insights from CET Nova." />
    <title>CET Nova | MHT-CET Preparation</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Public+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
